<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<button onclick="scanLike()" class="pay-btn">
  Pay ios
</button>
<div class="divider"/>
<button onclick="android()" class="pay-btn">
  Pay Android
</button>

<script>
  const cbu = "0000076500000048904245"

 function scanLike() {
    navigator.clipboard.writeText(cbu).then(() => {
      setTimeout(() => {
        window.location.href = "mercadopago://money-out/transfers/unified/input"
      }, 150)
    })
  }
 function android() {
    navigator.clipboard.writeText(cbu).then(() => {
      setTimeout(() => {
        window.location.href = "mercadopago://money-out/transfers/unified/home?component=input_pesos"
      }, 150)
    })
  }
</script>

<style>
  .pay-btn {
    width: 100%;
    height: 80px;
    font-size: 24px;
    border: none;
    border-radius: 12px;
    background: #0070f3;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  body {
    margin: 0;
    padding: 16px;
  }
  .divider {
    margin: 24px;
  }
</style>

</body>
</html>
