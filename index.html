<!DOCTYPE html>
<html>
  <body>
    <button onclick="openApp()">Open via Intent</button>

    <br /><br />

    <a id="payloadLink">
      <button>Open via href</button>
    </a>

    <script>
      const payload =
        '00020101021127730018ar.com.personalpay01474fbb6T3TEJ4RDQvYKFhMXh-rUmmCfR4oHnKSmYdZrpezF-05204739953030325802AR5916Ppay PAGOS FACIL6019Santiago del Estero80140010APP_MOBILE6304D242'

      function openApp() {
        const intentUrl =
          `intent://pay?data=${encodeURIComponent(payload)}#Intent;` +
          `package=ar.com.personalpay;` +
          `scheme=personalpay;end`

        window.location.href = intentUrl
      }

      document
        .getElementById('payloadLink')
        .setAttribute('href', payload)
    </script>
  </body>
</html>
